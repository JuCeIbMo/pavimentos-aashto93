# Compose para Dokploy (o cualquier servidor con proxy delante).
# Dokploy enruta el dominio al puerto 8000 del servicio "pavimentos" vía Traefik.
# Para probar en local sin proxy:  docker compose run --service-ports  o  ./run.sh
services:
  pavimentos:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
