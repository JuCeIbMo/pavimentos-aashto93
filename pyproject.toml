[project]
name = "pavimentos-aashto93"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "streamlit",
    "typst>=0.15.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pavimentos"]
